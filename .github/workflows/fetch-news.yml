name: Fetch & Upload News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore article ID cache
        uses: actions/cache@v4
        with:
          path: scripts/.article_cache.json
          key: article-ids-${{ github.run_id }}
          restore-keys: |
            article-ids-

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Run news fetcher
        env:
          CURRENTSAPI_KEY: ${{ secrets.CURRENTSAPI_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: python scripts/fetch_news.py

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
